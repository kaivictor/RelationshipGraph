name: 自动构建 Release APK

# 触发规则：打版本 Tag 时自动构建，例如 v1.0.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: 构建前端并同步到 Android
        run: |
          npm install
          npm run build
          npx cap sync android  # Cordova 项目替换为 cordova prepare android

      - name: 配置 JDK 环境
        uses: actions/setup-java@v4
        with:
          java-version: 21  # Android Gradle 插件 8.x 需 JDK 17+
          distribution: temurin

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: 还原签名密钥
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
          cat > android/keystore.properties <<'EOF'
          storeFile=release-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 构建签名 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}