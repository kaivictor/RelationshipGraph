name: 自动部署 GitHub Pages

# 触发规则：代码推送到 main 分支时自动执行
on:
  push:
    branches:
      - master

# 配置 Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1  # 替换为你项目使用的 Node 版本
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm install
          npm run build
        env:
          # 项目站点部署在 /<repo>/ 子路径下，需覆盖 Vite 默认的 base
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # 你的构建产物目录

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4